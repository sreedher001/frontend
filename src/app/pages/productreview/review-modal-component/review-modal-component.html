<div class="w-full max-w-md mx-auto p-4 sm:p-6 flex flex-col gap-5">

  <!-- Product Info -->
  <div class="flex items-center gap-4">
    <img
      [src]="data.imageUrl | resolveImage"
      [alt]="data.productName"
      class="w-16 h-16 sm:w-20 sm:h-20 rounded-xl object-cover border border-gray-200"
    />

    <div class="flex flex-col">
      <h3 class="text-base sm:text-lg font-semibold text-gray-900">
        {{ data.productName }}
      </h3>
      <small class="text-sm text-gray-500">
        {{ data.color }} • {{ data.size }}
      </small>
    </div>
  </div>

  <!-- Rating -->
  <div class="flex justify-center">
    <p-rating
      [(ngModel)]="rating"
      [stars]="5"
      styleClass="text-2xl sm:text-3xl">
    </p-rating>
  </div>

  <!-- Review Input -->
  <textarea
    pInputTextarea
    [(ngModel)]="comment"
    rows="4"
    placeholder="What did you like?"
    class="w-full rounded-xl p-3 text-sm sm:text-base border border-gray-300 focus:ring-2 focus:ring-gray-800 focus:outline-none resize-none">
  </textarea>

  <!-- Action -->
  <p-button
    severity="contrast"
    label="Submit Review"
    styleClass="w-full" size="large"
    [disabled]="rating === 0"
    (click)="submit()">
  </p-button>

</div>
