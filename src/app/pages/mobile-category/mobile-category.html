<div class="mt-10 flex h-[calc(100vh-60px)] overflow-hidden">

  <!-- LEFT CATEGORY MENU -->
<div
  class="w-1/3 bg-gray-50 border-r border-gray-200 py-3 sticky top-0 h-full"
  (wheel)="redirectScroll($event)">

  <div
    *ngFor="let cat of categories"
    (click)="scrollToCategory(cat)"
    [ngClass]="selectedCategory === cat ?
    'bg-white text-black font-semibold border-l-4 border-black shadow-sm' :
    'text-gray-500'"
    class="px-4 py-4 text-sm cursor-pointer transition-all duration-200">

    {{cat}}

  </div>

</div>


  <!-- RIGHT CONTENT -->
  <div
    #scrollContainer
    (scroll)="onScroll()"
    class="w-2/3 overflow-y-auto p-4 space-y-10">

    <div
      *ngFor="let cat of categories"
      [attr.id]="cat">

      <h6 class="text-sm font-semibold text-gray-800 mb-3">
        {{cat}}
      </h6>

      <div class="grid grid-cols-2 gap-x-3 gap-y-5">

  <div *ngFor="let item of getItems(cat); let last = last"
       class="flex flex-col items-center">

    <!-- Image Card -->
    <div class="relative w-full rounded-xl overflow-hidden shadow-sm cursor-pointer"
         (click)="last ? seeAll(cat) : openItem(item)">

      <!-- Image -->
      <img
        [src]="item.image"
        class="w-full h-36 object-cover"
        [ngClass]="last ? 'blur-sm brightness-75' : ''"/>

      <!-- SEE ALL overlay -->
      <div *ngIf="last"
           class="absolute inset-0 flex items-center justify-center">

        <span class="text-white font-semibold text-sm tracking-wide">
          SEE ALL →
        </span>

      </div>

    </div>

    <!-- Name (hide for SEE ALL) -->
    <p *ngIf="!last"
       class="text-center text-xs font-semibold mt-2 tracking-wide text-gray-700">
      {{item.name}}
    </p>

  </div>

</div>

    </div>

  </div>

</div>
