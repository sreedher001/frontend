<div>
    <h1>Product Details</h1>
</div>
<div class="flex flex-col lg:flex-row gap-6 items-start">

    <!-- Product Image Carousel -->
    <p-galleria [value]="images" [showItemNavigators]="true" [responsiveOptions]="responsiveOptions" [circular]="true"
        [numVisible]="3" [containerStyle]="{ 'width': '100%', 'maxWidth': '640px' }" class="w-full lg:w-1/2">
        <ng-template #item let-item>
            <div class="aspect-w-4 aspect-h-3">
                <img [src]="item.itemImageSrc" class="object-contain w-full h-full rounded-lg shadow" />
            </div>

        </ng-template>
        <ng-template #thumbnail let-item>
            <img [src]="item.thumbnailImageSrc" class="h-16 object-cover rounded" />
        </ng-template>
    </p-galleria>

    <!-- Product Info Section -->
    <div class="w-full lg:w-1/2 space-y-4">
        <h2 class="text-2xl font-semibold">{{ product.variant.variantName }}</h2>
        <p class="text-gray-600 text-sm">{{ product.variant.variantDescription }}</p>
        <p class="text-xl font-bold text-green-600">Rs.{{ product.category }}/-</p>
        <p-rating [(ngModel)]="product.rating" [readonly]="true" />
        <div class="flex flex-col sm:flex-row gap-3">
            <p-button label="Add to Cart" icon="pi pi-cart-plus" styleClass="w-full sm:w-auto" severity="secondary"
                raised pc119 rounded pc145 (onClick)="addToCart(product,$event)">
            </p-button>
            <p-button label="Buy Now" icon="pi pi-credit-card" raised pc119 rounded pc145 styleClass="w-full sm:w-auto"
                (onClick)="buyNow(product)">
            </p-button>
        </div>
    </div>
</div>

<div class="p-2">
    <h3>Similar Products</h3>
</div>
